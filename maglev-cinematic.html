<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MAGLEV | Cinematic Physics Animation</title><style>
*{box-sizing:border-box}body{margin:0;overflow:hidden;background:#060d1d;color:#fff;font-family:Arial,sans-serif}#stage{position:fixed;inset:0}#ui{position:fixed;top:5%;left:5%;pointer-events:none;text-shadow:0 2px 20px #000}h1{font-size:clamp(36px,6vw,82px);margin:0;letter-spacing:.12em;text-shadow:0 0 25px #15bfff}p{color:#b4eaff;font-size:clamp(15px,1.8vw,23px)}#bottom{position:fixed;bottom:4%;left:5%;right:5%;display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}button{border:1px solid #47dfff;background:#0b335cdd;color:white;border-radius:28px;padding:12px 19px;cursor:pointer;font-weight:bold}button:hover{background:#126aa2}.tag{padding:12px;border:1px solid #36b8ed;border-radius:12px;background:#061e3acc;color:#b8edff;font-size:13px}#note{position:fixed;top:5%;right:4%;max-width:270px;text-align:right;color:#d8f5ff;font-size:14px;line-height:1.6;pointer-events:none}#error{position:fixed;top:40%;left:10%;right:10%;background:#551a28;color:white;padding:20px;display:none}
</style></head><body><div id="stage"></div><div id="ui"><h1>MAGLEV</h1><p>THE TRAIN THAT FLOATS</p><p id="subtitle">Levitation • Propulsion • Magnetic Fields</p></div><div id="note">ELECTROMAGNETIC LEVITATION<br>Animated blue fields are illustrative, not a field-strength measurement.</div><div id="bottom"><button id="pause">Ⅱ Pause</button><div class="tag">GRADE 12 PHYSICS · CINEMATIC 3D</div><button id="camera">Change camera ↻</button></div><div id="error"></div>
<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.160.1/build/three.module.js';
try {
const scene=new THREE.Scene();scene.background=new THREE.Color(0x071429);scene.fog=new THREE.FogExp2(0x071429,.0055);
const camera=new THREE.PerspectiveCamera(57,innerWidth/innerHeight,.1,1200);
const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.outputColorSpace=THREE.SRGBColorSpace;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.35;document.getElementById('stage').appendChild(renderer.domElement);
scene.add(new THREE.HemisphereLight(0xa7d9ff,0x152039,2.2));const sun=new THREE.DirectionalLight(0xd8eaff,3.3);sun.position.set(-30,60,15);scene.add(sun);const blue=new THREE.PointLight(0x17bfff,60,80);blue.position.set(0,5,5);scene.add(blue);
const mat=(color,metalness=.2,roughness=.45,emissive=0x000000,intensity=0)=>new THREE.MeshStandardMaterial({color,metalness,roughness,emissive,emissiveIntensity:intensity});
const white=mat(0xe6f6ff,.65,.22),silver=mat(0x8eb5ce,.65,.25),glass=mat(0x071c39,.45,.14),dark=mat(0x14263f,.3,.5),cyan=mat(0x13bfff,.25,.2,0x04aaff,2.4),warm=mat(0xffe2a1,.1,.3,0xffcc66,1.5);
function mesh(geo,m,x=0,y=0,z=0,parent=scene){const o=new THREE.Mesh(geo,m);o.position.set(x,y,z);parent.add(o);return o}
function box(w,h,d,m,x=0,y=0,z=0,parent=scene){return mesh(new THREE.BoxGeometry(w,h,d),m,x,y,z,parent)}
function sphere(r,m,x,y,z,parent){return mesh(new THREE.SphereGeometry(r,16,12),m,x,y,z,parent)}
box(230,.4,550,mat(0x0b203b),0,-3.8,0);box(8,.7,500,dark,0,-.8,0);box(5,.24,500,silver,0,-.25,0);
for(let z=-240;z<=240;z+=7){box(9,.45,1.2,dark,0,-1.25,z);box(.36,.24,3.3,cyan,-3.2,-.12,z);box(.36,.24,3.3,cyan,3.2,-.12,z);if(z%14===-2||z%14===5){box(1.2,2,1.2,dark,-4,-2.4,z);box(1.2,2,1.2,dark,4,-2.4,z)}}
const coilLights=[];for(let z=-235;z<=235;z+=5){for(const side of [-1,1]){const o=box(.45,.18,2.8,cyan,side*2.7,.2,z);coilLights.push({o,z,side})}}
const cityMat=[mat(0x1a3558),mat(0x243e64),mat(0x18304e),mat(0x2a4160)];const windowMat=mat(0x8bc9ef,.05,.6,0x2f98db,1.4);
let seed=17;function rand(){seed=(seed*1664525+1013904223)>>>0;return seed/4294967296}
for(let i=0;i<100;i++){const side=i%2?-1:1;const z=(rand()-.5)*460;const x=side*(19+rand()*42);const h=8+rand()*46;const w=5+rand()*9;const d=5+rand()*11;box(w,h,d,cityMat[i%4],x,h/2-3.2,z);if(i%3===0){for(let y=3;y<h-2;y+=4){for(let q=-1;q<=1;q++){box(.55,.75,.08,windowMat,x+q*w*.24,y-3.2,z+d/2+.06)}}}}
const train=new THREE.Group();scene.add(train);const body=box(4.2,2.3,24,white,0,2.35,0,train);box(4.3,.32,23.2,silver,0,1.16,0,train);box(3.75,.48,19.5,white,0,3.64,0,train);box(4.24,.13,21,cyan,0,1.62,0,train);
// Smooth aerodynamic nose: progressively tapered elliptical cross-sections along train's forward (-Z) direction.
function nose(forward){const zs=[0,.8,1.8,3,4.2,5.2,5.8],ws=[2.06,1.98,1.7,1.24,.72,.26,.035],hs=[1.12,1.07,.9,.65,.37,.15,.025];const vertices=[],indices=[],segments=20;for(let k=0;k<zs.length;k++){for(let j=0;j<segments;j++){const a=j/segments*Math.PI*2;vertices.push(Math.cos(a)*ws[k],2.3+Math.sin(a)*hs[k],forward*(12+zs[k]))}}for(let k=0;k<zs.length-1;k++)for(let j=0;j<segments;j++){const a=k*segments+j,b=k*segments+(j+1)%segments,c=(k+1)*segments+j,d=(k+1)*segments+(j+1)%segments;indices.push(a,b,c,b,d,c)}const g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.Float32BufferAttribute(vertices,3));g.setIndex(indices);g.computeVertexNormals();mesh(g,white,0,0,0,train)}nose(-1);nose(1);
for(const side of [-1,1]){box(.09,.62,19.5,glass,side*2.15,2.65,0,train);box(.13,.12,20.5,cyan,side*2.2,1.78,0,train);for(let z=-8.5;z<=8.5;z+=2.5){box(.11,.68,.16,silver,side*2.23,2.67,z,train)}for(const z of [-12.2,12.2])sphere(.22,warm,side*1.05,2.05,z,train)}
// Side propulsion glow, undercarriage and levitation gap.
for(const side of [-1,1]){box(.65,.22,22,cyan,side*1.55,.94,0,train);for(let z=-9;z<=9;z+=3){sphere(.13,cyan,side*1.6,.68,z,train)}}
const fieldMat=new THREE.MeshBasicMaterial({color:0x17d9ff,transparent:true,opacity:.24,depthWrite:false,side:THREE.DoubleSide});const rings=[];for(let i=0;i<10;i++){const o=mesh(new THREE.TorusGeometry(1.55,.045,6,48),fieldMat.clone(),0,.5,-10+i*2.2,train);o.rotation.x=Math.PI/2;rings.push(o)}
const particles=[];const particleMat=new THREE.MeshBasicMaterial({color:0x2bdfff});for(let i=0;i<90;i++){const p=sphere(.035+rand()*.04,particleMat,(rand()-.5)*10,rand()*3-1,(rand()-.5)*80);particles.push(p)}
let elapsed=0,playing=true,view=0;const clock=new THREE.Clock();document.getElementById('pause').onclick=()=>{playing=!playing;document.getElementById('pause').textContent=playing?'Ⅱ Pause':'▶ Play'};document.getElementById('camera').onclick=()=>{view=(view+1)%4};
function animate(){requestAnimationFrame(animate);const dt=Math.min(clock.getDelta(),.05);if(playing)elapsed+=dt;const t=elapsed;train.position.z=-((t*8)%170)+75;train.position.y=Math.sin(t*2.5)*.035;train.rotation.z=Math.sin(t*.6)*.003;
for(const {o,z,side} of coilLights){const pulse=.5+.5*Math.sin(z*.38+t*7);o.material=cyan;o.scale.y=.6+pulse*1.6}for(let i=0;i<rings.length;i++){rings[i].material.opacity=.09+.22*(.5+.5*Math.sin(t*5-i*.65));rings[i].scale.setScalar(.95+.05*Math.sin(t*4+i))}for(let i=0;i<particles.length;i++){const p=particles[i];p.position.z+=playing?dt*(8+i%5):0;if(p.position.z>75)p.position.z=-75}
const z=train.position.z;const desired=new THREE.Vector3();const look=new THREE.Vector3(0,2,z);if(view===0)desired.set(17,9,z+28);else if(view===1)desired.set(21,5,z+3);else if(view===2)desired.set(0,7,z-33);else desired.set(2,32,z+12);camera.position.lerp(desired,.035);camera.lookAt(look);renderer.render(scene,camera)}animate();addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
}catch(err){document.getElementById('error').style.display='block';document.getElementById('error').textContent='Animation could not load: '+err.message;console.error(err)}
</script></body></html>
